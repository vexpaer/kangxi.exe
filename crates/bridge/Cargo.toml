[package]
name = "kangxi-bridge"
version = "0.1.1"
edition = "2021"
description = "Local Windows Agent Bridge for KangXi.exe — outbound sync and Codex / Claude Code managed session runner"

[lib]
name = "kangxi_bridge"
path = "src/lib.rs"

[[bin]]
name = "kangxi-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.19"
