<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KangXi.exe — Backend Online</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #271710 0%, #110c09 70%);
        color: #f4e9d8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        max-width: 540px;
        margin: 24px;
        padding: 32px;
        border-radius: 16px;
        background: rgba(29, 18, 13, 0.92);
        border: 1px solid rgba(214, 173, 96, 0.36);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      }
      .seal {
        display: inline-block;
        padding: 4px 12px;
        border: 2px solid #c9372c;
        color: #f06458;
        font-weight: 700;
        letter-spacing: 3px;
        border-radius: 4px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        color: #f7d996;
      }
      p {
        color: #cbbba4;
        line-height: 1.65;
        font-size: 14px;
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 2px 6px;
        border-radius: 4px;
        color: #ffe1a8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="seal">御批中枢 · 运行中</div>
      <h1>KangXi.exe Cloudflare Backend</h1>
      <p>
        Your self-hosted Cloudflare Worker + D1 + SQLite Durable Object instance is active.
      </p>
      <p>
        Paste this origin URL into the <strong>KangXi.exe</strong> Windows or Android app to
        initialize or pair your devices, or point MCP clients at <code>/mcp</code>.
      </p>
      <p>Health check: <code>GET /health</code></p>
    </main>
  </body>
</html>
