name: Build Windows & Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 (NSIS .exe + Bridge)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/client/src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: pnpm --filter @kangxi/protocol build && pnpm --filter @kangxi/app-core build

      - name: Build Windows NSIS installer
        run: pnpm --filter @kangxi/client tauri build --bundles nsis

      - name: Build standalone kangxi-bridge.exe
        run: cargo build --release -p kangxi-bridge

      - name: Stage clearly named Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          $ver = (Get-Content apps/client/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $nsis = Get-ChildItem "apps/client/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          Copy-Item $nsis.FullName "dist-artifacts/KangXi.exe-$ver-windows-x64-setup-unsigned.exe"
          Copy-Item "target/release/kangxi-bridge.exe" "dist-artifacts/kangxi-bridge-$ver-windows-x64.exe"
          Get-ChildItem dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: kangxi-windows-x64
          path: dist-artifacts/*
          if-no-files-found: error

  build-android:
    name: Android arm64 APK (Debug CI Build)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK & install NDK
        run: |
          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -1 "${ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT}/build-tools/35.0.0" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: pnpm --filter @kangxi/protocol build && pnpm --filter @kangxi/app-core build

      - name: Initialize Tauri Android project
        run: pnpm --filter @kangxi/client tauri android init --ci

      - name: Build Android arm64 debug APK
        run: pnpm --filter @kangxi/client tauri android build --apk --target aarch64 --debug

      - name: Stage clearly labeled Android debug APK
        run: |
          mkdir -p dist-artifacts
          VER=$(node -p "require('./apps/client/src-tauri/tauri.conf.json').version")
          APK=$(find apps/client/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "APK not found"; exit 1; fi
          cp "$APK" "dist-artifacts/KangXi-${VER}-android-arm64-debug.apk"
          ls -lh dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: kangxi-android-arm64-debug
          path: dist-artifacts/*.apk
          if-no-files-found: error
