name: Release Windows & Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

jobs:
  build-windows:
    name: Release Build — Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/client/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: pnpm --filter @kangxi/protocol build && pnpm --filter @kangxi/app-core build

      - name: Build Windows NSIS installer
        run: pnpm --filter @kangxi/client tauri build --bundles nsis

      - name: Build standalone kangxi-bridge.exe
        run: cargo build --release -p kangxi-bridge

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $ver = (Get-Content apps/client/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $nsis = Get-ChildItem "apps/client/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not found" }
          Copy-Item $nsis.FullName "release-assets/KangXi.exe-$ver-windows-x64-setup-unsigned.exe"
          Copy-Item "target/release/kangxi-bridge.exe" "release-assets/kangxi-bridge-$ver-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  build-android:
    name: Release Build — Android arm64 APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"
    outputs:
      signed: ${{ steps.check-signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK & install NDK
        run: |
          ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -1 "${ANDROID_SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT}/build-tools/35.0.0" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared workspace packages
        run: pnpm --filter @kangxi/protocol build && pnpm --filter @kangxi/app-core build

      - name: Initialize Tauri Android project
        run: pnpm --filter @kangxi/client tauri android init --ci

      - name: Check Android signing secrets
        id: check-signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PW" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PW" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure persistent Android release keystore
        if: steps.check-signing.outputs.signed == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat <<EOF > apps/client/src-tauri/gen/android/keystore.properties
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$KEYSTORE_PW
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PW
          EOF
          node scripts/configure-android-signing.mjs

      - name: Build signed Android release APK
        if: steps.check-signing.outputs.signed == 'true'
        run: pnpm --filter @kangxi/client tauri android build --apk --target aarch64

      - name: Build clearly labeled debug APK (signing secrets not configured)
        if: steps.check-signing.outputs.signed != 'true'
        run: pnpm --filter @kangxi/client tauri android build --apk --target aarch64 --debug

      - name: Stage Android APK
        run: |
          mkdir -p release-assets
          VER=$(node -p "require('./apps/client/src-tauri/tauri.conf.json').version")
          if [ "${{ steps.check-signing.outputs.signed }}" = "true" ]; then
            APK=$(find apps/client/src-tauri/gen/android/app/build/outputs/apk -path "*release*" -name "*.apk" | head -n 1)
            cp "$APK" "release-assets/KangXi-${VER}-android-arm64-release.apk"
          else
            APK=$(find apps/client/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$APK" "release-assets/KangXi-${VER}-android-arm64-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release & SHA-256 Checksums
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-bundle
          merge-multiple: true

      - name: Compute SHA-256 checksums & publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ANDROID_SIGNED: ${{ needs.build-android.outputs.signed }}
        run: |
          cd release-bundle
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          NOTES=$(cat <<EOF
          ## KangXi.exe ${TAG_NAME}

          ### Downloads
          - **Windows 10/11 x64 Installer**: \`*-windows-x64-setup-unsigned.exe\` (Unsigned build — Windows SmartScreen may display an unknown publisher prompt until a code signing certificate is configured.)
          - **Windows Standalone Bridge**: \`kangxi-bridge-*-windows-x64.exe\`
          - **Android 10+ arm64 APK**: $([ "$ANDROID_SIGNED" = "true" ] && echo "Signed release APK (\`*-android-arm64-release.apk\`)" || echo "Debug APK (\`*-android-arm64-debug.apk\`) — configure \`ANDROID_KEYSTORE_*\` Secrets for persistent release signing.")
          - **Integrity**: \`SHA256SUMS.txt\`

          See \`docs/SELF_HOST.md\` to deploy your Cloudflare Free backend and \`docs/CONNECT_AGENTS.md\` to connect Codex, Claude Code, or external MCP agents.
          EOF
          )

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" * --clobber
          else
            gh release create "$TAG_NAME" * --title "KangXi.exe ${TAG_NAME}" --notes "$NOTES"
          fi
